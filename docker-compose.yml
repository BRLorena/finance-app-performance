# The system under test: finance_app (production build) + its own Postgres.
# Load runs here, never against the Vercel deployment (see docs/adr-001).
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: finance
      POSTGRES_PASSWORD: finance
      POSTGRES_DB: finance
    ports: ["${DB_PORT:-5433}:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finance"]
      interval: 2s
      retries: 30

  app:
    image: finance-app:local
    build:
      context: app
      args:
        APP_REF: ${APP_REF:-master}
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://finance:finance@db:5432/finance
      POSTGRES_URL: postgresql://finance:finance@db:5432/finance
      AUTH_SECRET: perf-local-secret-not-for-production
      AUTH_TRUST_HOST: "true"
      AUTH_URL: http://localhost:${APP_PORT:-3300}
    ports: ["${APP_PORT:-3300}:3000"]
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3000/api/auth/csrf').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 3s
      retries: 40
